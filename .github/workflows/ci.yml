name: Setu CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: setu/package-lock.json

      - name: Install Dependencies
        run: |
          cd setu
          npm ci

      - name: Run ESLint
        run: |
          cd setu
          npm run lint

      - name: Run Type Check
        run: |
          cd setu
          npm run typecheck

      - name: Run Unit Tests & Coverage
        run: |
          cd setu
          npm run test:coverage
