<style>
        body {
            background-color: #f9f9fc;
            font-family: 'Hanken Grotesk', sans-serif;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-canvas {
            background-image: radial-gradient(circle at 2px 2px, #e2e2e5 1px, transparent 0);
            background-size: 24px 24px;
        }
        .route-path {
            stroke-dasharray: 8;
            animation: dash 30s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

<body class="flex flex-col h-screen">
<!-- TopAppBar -->

</div>

<button class="active:scale-95 transition-transform duration-150 p-sm hover:bg-surface-container-low dark:hover:bg-secondary-container rounded-full">

</button>
</div>
</header>
<!-- Main Map Area -->

<!-- Stadium SVG Map -->

<!-- Inner Pitch -->
<rect fill="#00543b" height="80" opacity="0.1" rx="4" width="120" x="140" y="110"></rect>
<rect fill="none" height="80" rx="4" stroke="#00543b" stroke-width="1" width="120" x="140" y="110"></rect>
<!-- Sections (simplified) -->
<g fill="none" stroke="#bec9c1" stroke-width="1">
<!-- North Stand -->
<path d="M120,40 Q200,30 280,40"></path>
<!-- South Stand -->
<path d="M120,260 Q200,270 280,260"></path>
<!-- West Stand -->
<path d="M50,100 Q40,150 50,200"></path>
<!-- East Stand -->
<path d="M350,100 Q360,150 350,200"></path>
</g>
<!-- Gate Labels -->
<g class="font-label-caps text-[8px]" fill="#3f4943">
<circle cx="200" cy="20" fill="white" r="8" stroke="#6f7a73"></circle>
<text class="font-bold" x="194" y="23">G1</text>
<circle cx="380" cy="150" fill="white" r="8" stroke="#6f7a73"></circle>
<text class="font-bold" x="374" y="153">G2</text>
<circle cx="200" cy="280" fill="white" r="8" stroke="#6f7a73"></circle>
<text class="font-bold" x="194" y="283">G3</text>
<circle cx="20" cy="150" fill="white" r="8" stroke="#6f7a73"></circle>
<text class="font-bold" x="14" y="153">G4</text>
</g>
<!-- Section Numbers -->
<text class="font-bold text-[10px]" fill="#6f7a73" x="188" y="70">104</text>
<text class="font-bold text-[10px]" fill="#6f7a73" x="188" y="240">122</text>
<text class="font-bold text-[10px]" fill="#6f7a73" x="80" y="155">112</text>
<text class="font-bold text-[10px]" fill="#6f7a73" x="300" y="155">134</text>

<path class="route-path" d="M200,20 L200,60" fill="none" stroke="#00543b" stroke-linecap="round" stroke-width="4"></path>
<!-- Start/End Pins -->
<g>
<!-- Current Position Pin -->
<circle cx="200" cy="20" fill="#ba1a1a" r="5"></circle>
<circle cx="200" cy="20" fill="#ba1a1a" opacity="0.2" r="10">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="5;12;5"></animate>
</circle>
<!-- Destination Pin -->
<path d="M200,60 L204,52 L196,52 Z" fill="#00543b"></path>
<circle cx="200" cy="50" fill="#00543b" r="6"></circle>
<circle cx="200" cy="50" fill="white" r="2"></circle>

</div>

</div>

<div class="flex gap-md items-start p-md opacity-60">
<div class="w-touch-target h-touch-target bg-surface-container-highest rounded-full flex items-center justify-center text-on-surface-variant flex-shrink-0">

<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-label-caps text-label-caps">Ops</span>
</button>
</nav>
<script>
        // Simple Interaction logic for bottom sheet drag
        const sheet = document.getElementById('directionSheet');
        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
        });

        sheet.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if (diff > 0) {
                sheet.style.transform = `translateY(${diff}px)`;
            }
        });

        sheet.addEventListener('touchend', () => {
            isDragging = false;
            const diff = currentY - startY;
            if (diff > 100) {
                // Minimize state logic could go here
                sheet.style.transform = `translateY(180px)`;
            } else {
                sheet.style.transform = `translateY(0)`;
            }
        });
    </script>
</body></html>
